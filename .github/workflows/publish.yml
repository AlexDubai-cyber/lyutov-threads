name: Публикация в Threads

on:
  schedule:
    # Каждые 30 минут с 08:17 до 22:47 по Дубаю (UTC+4). Время конкретного поста задаёт times.json.
    - cron: "17,47 4-18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = только проверить ключ, ничего не публиковать"
        default: "1"

permissions:
  contents: write

concurrency: threads-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Опубликовать пост, если подошло время
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python publish.py
      - name: Сохранить журнал публикаций
        run: |
          touch metrics.json
          if [ -n "$(git status --porcelain published.json metrics.json)" ]; then
            git config user.name "threads-bot"
            git config user.email "threads-bot@users.noreply.github.com"
            git add published.json metrics.json
            git commit -m "Журнал публикаций и метрики"
            git pull --rebase && git push
          fi
