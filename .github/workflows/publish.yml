name: Публикация в Threads

on:
  schedule:
    # Резерв: GitHub запускает cron с большими задержками, поэтому основной режим — цепочка
    # долгих запусков (каждый ~5 ч 45 мин проверяет очередь раз в минуту и перезапускает себя).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = только проверить ключ, ничего не публиковать"
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Публиковать по расписанию из times.json
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LOOP_MINUTES: ${{ github.event.inputs.dry_run == '1' && '0' || '340' }}
        run: python publish.py
      - name: Продолжить цепочку
        if: ${{ !cancelled() && github.event.inputs.dry_run != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Продолжаем цепочку только после полного долгого прохода (~5 ч 40 мин).
          # Если запуск упал сразу, новый не запускаем: через час его поднимет резервный cron.
          # Так ошибка ключа или сбой Meta не превращаются в сотни запусков подряд.
          if [ -f .ran_long ]; then
            gh workflow run publish.yml --ref main -f dry_run=0
          else
            echo "Короткий запуск завершился ошибкой, цепочку не продолжаю, ждём cron"
          fi
